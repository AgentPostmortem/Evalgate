# Example: gate every PR on prompt/agent quality.
# Drop a file like this into any repo that consumes evalgate.
name: evalgate

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gate on eval regressions
        # Run the CLI from source so the gate always exercises the code on
        # this branch, including unreviewed fixes (npx would pin the npm
        # release, which lags main).
        run: |
          npm ci
          npm run build
          GITHUB_TOKEN="${{ github.token }}" node dist/cli/index.js compare \
            examples/support-agent.eval.yaml \
            --base examples/support-agent.baseline.json \
            --provider mock \
            --tolerance 0.01 \
            --comment
